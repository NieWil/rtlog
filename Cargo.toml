[workspace]
resolver = "2"
members = ["crates/rtlog-core", "crates/rtlog-decode", "examples"]

[workspace.package]
version = "0.2.2"
edition = "2021"
repository = "https://github.com/NieWil/rtlog"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/NieWil/rtlog"

# Optimised profile for release binaries: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
