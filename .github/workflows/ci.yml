name: ci

# Each commit is checked once: pull requests run on `pull_request`, and only
# `main` runs on `push` (the merged result, and the README badge). Pushing
# to a PR branch no longer starts a second, identical run, and a new push
# cancels the run it supersedes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs build without warnings (incl. missing docs on public items)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Dependency, spelling, workflow, shell-script and C/C++ static checks. Each
  # tool's config is in the repository root (deny.toml, _typos.toml,
  # .clang-tidy); CONTRIBUTING.md says how to run them locally.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,typos,shellcheck
      - name: Dependencies (advisories, licences, sources)
        run: cargo deny check
      - name: Spelling
        run: typos
      - name: Workflows
        # install-action has no actionlint; the PyPI package ships its binary.
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      - name: Shell scripts
        run: shellcheck scripts/*.sh scripts/demo/*.sh
      - name: Board results (format, and results/README.md up to date)
        run: python3 scripts/results.py --check
      - name: C/C++ header (clang-tidy)
        run: |
          sudo apt-get install -y -qq clang-tidy >/dev/null
          clang-tidy --version
          for f in c/examples/demo.c c/examples/crash.c; do
            clang-tidy "$f" --quiet -- -std=gnu11 -pthread -I c/include
          done
          clang-tidy c/examples/demo.cpp --quiet -- -std=c++17 -pthread -I c/include

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  no-std:
    name: no_std (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7m-none-eabi          # Cortex-M3
          - thumbv7em-none-eabihf       # Cortex-M4F / M7
          - thumbv8m.main-none-eabihf   # Cortex-M33
          - riscv32imac-unknown-none-elf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rtlog --no-default-features --target ${{ matrix.target }} --release

  cross:
    name: tests on ${{ matrix.target }} (QEMU)
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - riscv64gc-unknown-linux-gnu
          - i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: basic (threads, file drain, decode)
        run: cargo run -p rtlog-examples --example basic -- target/example-out
      - name: static_rings (no_std API, custom clock)
        run: cargo run -p rtlog-examples --example static_rings
      - name: stdout_mode (text on stdout, level from RTLOG)
        run: RTLOG=debug cargo run -p rtlog-examples --example stdout_mode | tee stdout.txt && grep -q "DEBUG   request id=2" stdout.txt
      - name: app_trace (spans, lock watchdog, memory counters; Perfetto export)
        run: cargo run --release -p rtlog-examples --example app_trace -- target/example-out/app_trace
      - name: CLI decodes the captured file
        run: |
          cargo run -q -p rtlog-decode --bin rtlog -- check target/example-out/basic.contract.jsonl
          cargo run -q -p rtlog-decode --bin rtlog -- decode --contract target/example-out/basic.contract.jsonl target/example-out/basic.rtlog
          cargo run -q -p rtlog-decode --bin rtlog -- decode --perfetto -o target/example-out/app_trace/cli.perfetto.json \
            --contract target/example-out/app_trace/app.contract.jsonl target/example-out/app_trace/app.rtlog
          python3 -c "import json,sys; t=json.load(open(sys.argv[1])); print(len(t['traceEvents']), 'trace events')" target/example-out/app_trace/cli.perfetto.json
      - uses: actions/upload-artifact@v4
        with:
          name: example-capture
          path: target/example-out/
      - uses: actions/upload-artifact@v4
        with:
          name: app-trace-perfetto
          path: target/example-out/app_trace/app.perfetto.json

  c-cpp:
    name: C / C++ (${{ matrix.cc }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest, cc: clang, cxx: clang++ }   # Apple Clang, Mach-O
          - { os: windows-latest, cc: gcc, cxx: g++ }       # MinGW-w64, PE
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build, run, extract contract from the binary (ELF, Mach-O, PE), decode
        run: |
          ${{ matrix.cc }} --version
          scripts/c_e2e.sh ${{ matrix.cc }} ${{ matrix.cxx }}
      - name: C++ demo with Clang for the MSVC ABI (lld-link or link.exe, no pthreads)
        if: runner.os == 'Windows'
        run: |
          clang++ --version
          out=target/c-e2e/clang-msvc && mkdir -p "$out"
          # The demo opens its capture with fopen, which Microsoft's headers mark as deprecated.
          # The runner image pairs Visual Studio's C++ library with an older LLVM
          # than that library asks for (since 2026-11: MSVC 14.52 wants Clang 22,
          # the image has Clang 20), and the library then refuses to compile
          # (error STL1000). _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH is
          # Microsoft's switch for that check; the build and the run below are
          # otherwise unchanged.
          clang++ -O2 -std=c++17 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH -I c/include c/examples/demo.cpp -o "$out/demo_cpp.exe"
          "$out/demo_cpp.exe" "$out/demo_cpp.rtlog"
          target/debug/rtlog contract --elf "$out/demo_cpp.exe" -o "$out/demo_cpp.contract.jsonl"
          target/debug/rtlog decode --contract "$out/demo_cpp.contract.jsonl" "$out/demo_cpp.rtlog" > "$out/demo_cpp.txt"
          grep -q "INFO    request id=0 route=/health" "$out/demo_cpp.txt"
          grep -q "WARN  shutdown pending=0 ok=true" "$out/demo_cpp.txt"
      - name: Stripped builds (Rust strip feature, C RTLOG_STRIP), GNU ld
        if: matrix.cc == 'gcc' && runner.os == 'Linux'
        run: scripts/strip_e2e.sh gcc
      - name: ThreadSanitizer and AddressSanitizer on the C demo
        if: matrix.cc == 'gcc' && runner.os == 'Linux'
        run: |
          gcc -O1 -g -std=gnu11 -pthread -fsanitize=thread -I c/include c/examples/demo.c -o tsan_demo
          TSAN_OPTIONS=halt_on_error=1 setarch -R ./tsan_demo tsan.rtlog
          gcc -O1 -g -std=gnu11 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all -I c/include c/examples/demo.c -o asan_demo
          ./asan_demo asan.rtlog
      - uses: actions/upload-artifact@v4
        with:
          name: c-cpp-capture-${{ matrix.cc }}-${{ runner.os }}
          path: target/c-e2e/

  # The Zephyr module on an emulated Cortex-M3 (qemu_cortex_m3): build the
  # hello sample, run it in QEMU with the console UART captured, read the
  # contract from zephyr.elf and decode the capture.
  zephyr-qemu:
    name: Zephyr (qemu_cortex_m3)
    runs-on: ubuntu-latest
    env:
      ZEPHYR_VERSION: v4.5.0
      ZEPHYR_SDK_VERSION: 1.0.1
      ZEPHYR_BASE: /opt/zephyrproject/zephyr
      ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build gperf device-tree-compiler qemu-system-arm >/dev/null
      - uses: actions/cache@v4
        id: zephyr
        with:
          path: |
            /opt/zephyrproject
            /opt/zephyr-sdk
          key: zephyr-${{ env.ZEPHYR_VERSION }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-arm
      - run: pip install -q west
      - name: Zephyr sources and the Arm toolchain of the SDK
        if: steps.zephyr.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/zephyrproject /opt/zephyr-sdk
          sudo chown "$USER" /opt/zephyrproject /opt/zephyr-sdk
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_VERSION" --clone-opt=--depth=1 /opt/zephyrproject
          (cd /opt/zephyrproject && west update cmsis cmsis_6 --narrow -o=--depth=1)
          base=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$ZEPHYR_SDK_VERSION
          f=zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz
          cd "$RUNNER_TEMP"
          wget -q "$base/$f" "$base/sha256.sum"
          grep " $f\$" sha256.sum | sha256sum -c -
          tar -xf "$f" -C /opt/zephyr-sdk --strip-components=1
          /opt/zephyr-sdk/setup.sh -t arm-zephyr-eabi
      - run: pip install -q -r /opt/zephyrproject/zephyr/scripts/requirements-base.txt
      - name: Build, run in QEMU, read the contract from zephyr.elf, decode
        run: QEMU=qemu-system-arm scripts/zephyr_qemu.sh | tee zephyr-qemu.md
      - name: The same with CONFIG_RTLOG_STRIP=y (no format string in zephyr.bin)
        run: >
          QEMU=qemu-system-arm RTLOG_QEMU_NAME=hello-strip
          scripts/zephyr_qemu.sh -DCONFIG_RTLOG_STRIP=y | tee -a zephyr-qemu.md
      - run: cat zephyr-qemu.md >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload with GitHub's identity token, no secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --no-report
      - name: Coverage report (fails below the minimum)
        # Minimum line coverage (98.7 % at v0.2.4). Raise it when coverage goes
        # up; lowering it needs a reason in the PR. What stays uncovered is
        # platform code this x86-64 Linux job cannot run and syscall failures
        # that need fault injection.
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo "## Unit test coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines 97
      - name: Upload to Codecov
        if: always() && hashFiles('lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false # a Codecov outage must not fail CI; the gate above does
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('lcov.info') != ''
        with:
          name: coverage-lcov
          path: lcov.info

  timing:
    name: timing report (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p rtlog-examples --example timing -- --out timing.md
      - run: cat timing.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: timing-report-${{ matrix.arch }}
          path: timing.md

  spec-rules:
    name: spec rules (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: spec-${{ matrix.arch }}
          workspaces: |
            .
            size/mcu
      - name: Timing (twice; the best run counts on a shared runner)
        run: |
          cargo run --release -p rtlog-examples --example timing -- --out timing-1.md
          cargo run --release -p rtlog-examples --example timing -- --out timing-2.md
      - name: Size on Cortex-M4F
        if: matrix.arch == 'x86_64'
        run: python3 scripts/size_report.py --out size.md
      - name: Check the spec's rules (real-time, wire, usability, memory; performance reported)
        run: |
          size_arg=()
          [ -f size.md ] && size_arg=(--size size.md)
          python3 scripts/spec_check.py --timing timing-1.md timing-2.md "${size_arg[@]}" | tee spec-check.md
          exit "${PIPESTATUS[0]}"
      - if: always()
        run: cat spec-check.md >> "$GITHUB_STEP_SUMMARY"

  size:
    name: size (Cortex-M4F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: size/mcu
      - run: python3 scripts/size_report.py --out size.md
      - run: cat size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: size.md

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Criterion (short run)
        run: |
          cargo bench -p rtlog --bench log_call -- --warm-up-time 1 --measurement-time 3
          cargo bench -p rtlog-decode --bench decode -- --warm-up-time 1 --measurement-time 3
      - name: Benchmark summary
        run: python3 scripts/bench_report.py target/criterion | tee bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: |
            bench.md
            target/criterion/

  miri:
    name: miri (unsafe ring code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri setup
      - run: "cargo miri test -p rtlog --lib -- ring:: varint:: arg:: hash:: drain:: wire:: level::"

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      TSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.sanitizer }}
      - run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p rtlog -p rtlog-decode --lib --tests

  soak:
    name: soak (2 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p rtlog-decode --test soak -- --ignored --nocapture
        env:
          RTLOG_SOAK_SECS: "120"
          RTLOG_SOAK_REPORT: ${{ github.workspace }}/soak.md
      - run: cat soak.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: soak.md
