name: ci

# Each commit is checked once: pull requests run on `pull_request`, and only
# `main` runs on `push` (the merged result, and the README badge). Pushing
# to a PR branch no longer starts a second, identical run, and a new push
# cancels the run it supersedes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  no-std:
    name: no_std (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7m-none-eabi          # Cortex-M3
          - thumbv7em-none-eabihf       # Cortex-M4F / M7
          - thumbv8m.main-none-eabihf   # Cortex-M33
          - riscv32imac-unknown-none-elf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rtlog-core --no-default-features --target ${{ matrix.target }} --release

  cross:
    name: tests on ${{ matrix.target }} (QEMU)
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - riscv64gc-unknown-linux-gnu
          - i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: basic (threads, file drain, decode)
        run: cargo run -p rtlog-examples --example basic -- target/example-out
      - name: static_rings (no_std API, custom clock)
        run: cargo run -p rtlog-examples --example static_rings
      - name: stdout_mode (text on stdout, level from RTLOG)
        run: RTLOG=debug cargo run -p rtlog-examples --example stdout_mode | tee stdout.txt && grep -q "DEBUG   request id=2" stdout.txt
      - name: app_trace (spans, lock watchdog, memory counters; Perfetto export)
        run: cargo run --release -p rtlog-examples --example app_trace -- target/example-out/app_trace
      - name: CLI decodes the captured file
        run: |
          cargo run -q -p rtlog-decode --bin rtlog -- check target/example-out/basic.contract.jsonl
          cargo run -q -p rtlog-decode --bin rtlog -- decode --contract target/example-out/basic.contract.jsonl target/example-out/basic.rtlog
          cargo run -q -p rtlog-decode --bin rtlog -- decode --perfetto -o target/example-out/app_trace/cli.perfetto.json \
            --contract target/example-out/app_trace/app.contract.jsonl target/example-out/app_trace/app.rtlog
          python3 -c "import json,sys; t=json.load(open(sys.argv[1])); print(len(t['traceEvents']), 'trace events')" target/example-out/app_trace/cli.perfetto.json
      - uses: actions/upload-artifact@v4
        with:
          name: example-capture
          path: target/example-out/
      - uses: actions/upload-artifact@v4
        with:
          name: app-trace-perfetto
          path: target/example-out/app_trace/app.perfetto.json

  c-cpp:
    name: C / C++ (${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build, run, extract contract from ELF, decode
        run: scripts/c_e2e.sh ${{ matrix.cc }} ${{ matrix.cxx }}
      - name: ThreadSanitizer and AddressSanitizer on the C demo
        if: matrix.cc == 'gcc'
        run: |
          gcc -O1 -g -std=gnu11 -pthread -fsanitize=thread -I c/include c/examples/demo.c -o tsan_demo
          TSAN_OPTIONS=halt_on_error=1 setarch -R ./tsan_demo tsan.rtlog
          gcc -O1 -g -std=gnu11 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all -I c/include c/examples/demo.c -o asan_demo
          ./asan_demo asan.rtlog
      - uses: actions/upload-artifact@v4
        with:
          name: c-cpp-capture-${{ matrix.cc }}
          path: target/c-e2e/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo "## Unit test coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  timing:
    name: timing report (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p rtlog-examples --example timing -- --out timing.md
      - run: cat timing.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: timing-report-${{ matrix.arch }}
          path: timing.md

  spec-rules:
    name: spec rules (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: spec-${{ matrix.arch }}
          workspaces: |
            .
            size/mcu
      - name: Timing (twice; the best run counts on a shared runner)
        run: |
          cargo run --release -p rtlog-examples --example timing -- --out timing-1.md
          cargo run --release -p rtlog-examples --example timing -- --out timing-2.md
      - name: Size on Cortex-M4F
        if: matrix.arch == 'x86_64'
        run: python3 scripts/size_report.py --out size.md
      - name: Check the spec's rules (real-time, wire, usability, performance, memory)
        run: |
          size_arg=""
          [ -f size.md ] && size_arg="--size size.md"
          python3 scripts/spec_check.py --timing timing-1.md timing-2.md $size_arg | tee spec-check.md
          exit ${PIPESTATUS[0]}
      - if: always()
        run: cat spec-check.md >> "$GITHUB_STEP_SUMMARY"

  size:
    name: size (Cortex-M4F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: size/mcu
      - run: python3 scripts/size_report.py --out size.md
      - run: cat size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: size.md

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Criterion (short run)
        run: |
          cargo bench -p rtlog-core --bench log_call -- --warm-up-time 1 --measurement-time 3
          cargo bench -p rtlog-decode --bench decode -- --warm-up-time 1 --measurement-time 3
      - name: Benchmark summary
        run: python3 scripts/bench_report.py target/criterion | tee bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: |
            bench.md
            target/criterion/

  miri:
    name: miri (unsafe ring code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri setup
      - run: "cargo miri test -p rtlog-core --lib -- ring:: varint:: arg:: hash:: drain:: wire:: level::"

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      TSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.sanitizer }}
      - run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p rtlog-core -p rtlog-decode --lib --tests

  soak:
    name: soak (2 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p rtlog-decode --test soak -- --ignored --nocapture
        env:
          RTLOG_SOAK_SECS: "120"
          RTLOG_SOAK_REPORT: ${{ github.workspace }}/soak.md
      - run: cat soak.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: soak.md
