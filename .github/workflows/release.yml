name: release

# Builds optimised `rtlog` CLI binaries and the demo package (examples + run
# script, docs/demo.md) for every supported host, and packages the C/C++
# header with the Zephyr module.
#
# - Pull requests that change this workflow or the workspace manifest: dry run
#   (build and package only). Code changes are already built and tested by ci.
# - Actions → release → "Run workflow" with a version such as v0.1.0: builds
#   from the selected branch, creates that tag and publishes the release.
# - Pushing a `v*` tag yourself: publishes the release for that tag.
#
# A published release also publishes rtlog and rtlog-decode to crates.io
# with Trusted Publishing: no stored token, crates.io checks that the run
# comes from this repository's release.yml (docs/releasing.md). Every run, dry runs
# included, packages and verifies both crates first.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "scripts/demo/**"
      - "docs/demo.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.1.0. Creates this tag on the selected branch. Leave empty for a dry run."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches Cargo.toml
        if: env.RELEASE_VERSION != 'dev'
        run: |
          v="$RELEASE_VERSION"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$v' is not a version like v0.1.0"; exit 1; }
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$cargo_version" = "$v" ] || { echo "::error::$v does not match Cargo.toml version $cargo_version"; exit 1; }
          if [ "${{ github.ref_type }}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "::error::tag $v already exists"; exit 1
          fi
          echo "Releasing $v from ${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and verify the crates (crates.io dry run)
        run: cargo publish --workspace --dry-run --locked

  cli:
    needs: check
    name: rtlog CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build (dist profile, fat LTO, stripped)
        run: cargo build --profile dist -p rtlog-decode --bin rtlog --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.cross || matrix.target == 'aarch64-apple-darwin' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/dist/rtlog
          [ -f "$bin.exe" ] && bin="$bin.exe"
          runner_var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z.-' 'A-Z__')_RUNNER"
          ${!runner_var:-} "$bin" --help | head -3
      - name: Build the demo (examples, dist profile)
        run: cargo build --profile dist -p rtlog-examples --example timing --example perfetto_quickstart --example app_trace --example stdout_mode --target ${{ matrix.target }}
      - name: Package the demo
        shell: bash
        run: |
          name=rtlog-demo-${{ env.RELEASE_VERSION }}-${{ matrix.target }}
          ext=; [ "${{ runner.os }}" = "Windows" ] && ext=.exe
          mkdir -p "dist/$name/bin"
          for e in timing perfetto_quickstart app_trace stdout_mode; do
            cp "target/${{ matrix.target }}/dist/examples/$e$ext" "dist/$name/bin/"
          done
          cp "target/${{ matrix.target }}/dist/rtlog$ext" "dist/$name/bin/"
          cp docs/demo.md "dist/$name/README.md"
          sed -i.bak 's#](\.\./examples)#](https://github.com/NieWil/rtlog/tree/main/examples)#; s#](performance.md#](https://github.com/NieWil/rtlog/blob/main/docs/performance.md#' "dist/$name/README.md" && rm "dist/$name/README.md.bak"
          cp scripts/demo/run.sh LICENSE-MIT LICENSE-APACHE "dist/$name/"
          chmod +x "dist/$name/run.sh"
      - name: Smoke test the demo
        shell: bash
        run: |
          dir=dist/rtlog-demo-${{ env.RELEASE_VERSION }}-${{ matrix.target }}
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ] || [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then
            "$dir/run.sh" "$RUNNER_TEMP/demo"     # the whole demo, natively
            grep -q "W1 scalar" "$RUNNER_TEMP/demo/timing.md"
            test -s "$RUNNER_TEMP/demo/app/app.perfetto.json"
          else
            ext=; [ "${{ runner.os }}" = "Windows" ] && ext=.exe
            runner_var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z.-' 'A-Z__')_RUNNER"
            if [ "${{ matrix.os }}" != macos-latest ] || [ -n "${!runner_var:-}" ]; then
              ${!runner_var:-} "$dir/bin/perfetto_quickstart$ext" "$RUNNER_TEMP/q.perfetto.json"
              test -s "$RUNNER_TEMP/q.perfetto.json"
            fi
          fi
      - name: Package
        shell: bash
        run: |
          name=rtlog-${{ env.RELEASE_VERSION }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/dist/rtlog
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          demo=rtlog-demo-${{ env.RELEASE_VERSION }}-${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null; 7z a "$demo.zip" "$demo" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"; tar czf "$demo.tar.gz" "$demo"
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  c-package:
    name: C/C++ header and Zephyr module
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          name=rtlog-c-${{ env.RELEASE_VERSION }}
          mkdir -p "dist/$name"
          cp -r c/include c/examples c/zephyr zephyr docs/c-cpp.md docs/zephyr.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: c-package
          path: dist/*.tar.gz

  publish:
    name: publish GitHub release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [cli, c-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          # The section for this version: from its heading to the next one.
          awk -v v="## $RELEASE_VERSION" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: rtlog ${{ env.RELEASE_VERSION }}
          body_path: notes.md
          files: dist/*

  crates-io:
    name: publish to crates.io
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub's identity token, exchanged for a crates.io token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Get a short-lived crates.io token (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish rtlog, then rtlog-decode
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${RELEASE_VERSION#v}
          for crate in rtlog rtlog-decode; do
            # Re-running the job skips what an earlier attempt already uploaded.
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'rtlog-release (github.com/NieWil/rtlog)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$code" = 200 ]; then echo "$crate $version is already on crates.io"; continue; fi
            cargo publish -p "$crate" --locked
          done
