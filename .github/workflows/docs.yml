name: docs

# Each commit is checked once: pull requests run on `pull_request`, and only
# `main` runs on `push` (the merged result, and the README badge). Pushing
# to a PR branch no longer starts a second, identical run, and a new push
# cancels the run it supersedes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
