name: bench

# Continuous benchmarking with Bencher (https://bencher.dev): every push to
# `main` adds a point to the history, and a pull request from this repository
# is compared with it, with the result posted on the pull request.
#
# Three kinds of numbers go in, and they are treated differently:
# - sizes on Cortex-M4F (flash, RAM, code per call site) are the same on every
#   run, so a pull request that grows one by more than 2 % fails this workflow;
# - instructions per log call, counted with Valgrind's callgrind, are the same
#   on every run of the same binary, and gate a pull request the same way;
# - the same count for the access-log call of the Pingora reference
#   application (reference/pingora), through log, tracing and rtlog;
# - Criterion timings come from a shared runner and vary by several percent,
#   so they are tracked and reported but never fail the workflow.
#
# The Bencher project is `rtlog-niewil`, or the slug in the repository variable
# BENCHER_PROJECT. Without the BENCHER_API_KEY secret the runs go to it as an
# unclaimed project; once the project is claimed on bencher.dev, add an API
# key of that same project as the repository secret (docs/performance.md).
# A key of another project is refused with "Invalid project key".
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT || 'rtlog-niewil' }}
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}

jobs:
  bencher:
    name: Bencher (${{ matrix.what }})
    # Pull requests from forks have no access to the secret and may not
    # comment; they still get the size and timing reports of ci.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        what: [size, instructions, timing, pingora]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ matrix.what }}
          workspaces: |
            .
            size/mcu
            reference/pingora
      - uses: bencherdev/bencher@main
      - name: Branch and baseline
        id: branch
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "args=--branch $GITHUB_HEAD_REF --hash ${{ github.event.pull_request.head.sha }} --start-point $GITHUB_BASE_REF --start-point-hash ${{ github.event.pull_request.base.sha }} --start-point-clone-thresholds --start-point-reset" >> "$GITHUB_OUTPUT"
          else
            echo "args=--branch main" >> "$GITHUB_OUTPUT"
          fi
      - name: Sizes on Cortex-M4F (a growth of more than 2 % fails)
        if: matrix.what == 'size'
        run: |
          # An empty key is not "no key": without the secret, leave the variable out.
          [ -n "$BENCHER_API_KEY" ] || unset BENCHER_API_KEY
          # shellcheck disable=SC2086 # the branch arguments are a list of options
          bencher run ${{ steps.branch.outputs.args }} \
            --testbed thumbv7em-none-eabihf \
            --threshold-measure flash-bytes --threshold-test percentage --threshold-upper-boundary 0.02 \
            --threshold-measure ram-bytes --threshold-test percentage --threshold-upper-boundary 0.02 \
            --threshold-measure code-bytes --threshold-test percentage --threshold-upper-boundary 0.02 \
            --thresholds-reset \
            --error-on-alert \
            --adapter json \
            --file sizes.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            "python3 scripts/size_report.py --bmf sizes.json"
      - name: Instructions per log call (a growth of more than 2 % fails)
        if: matrix.what == 'instructions'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind >/dev/null
          valgrind --version
          # An empty key is not "no key": without the secret, leave the variable out.
          [ -n "$BENCHER_API_KEY" ] || unset BENCHER_API_KEY
          # shellcheck disable=SC2086 # the branch arguments are a list of options
          bencher run ${{ steps.branch.outputs.args }} \
            --testbed callgrind-x86_64 \
            --threshold-measure instructions --threshold-test percentage --threshold-upper-boundary 0.02 \
            --thresholds-reset \
            --error-on-alert \
            --adapter json \
            --file icount.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            "python3 scripts/icount.py --bmf icount.json --out icount.md"
          cat icount.md >> "$GITHUB_STEP_SUMMARY"
      # A program rtlog's authors did not write: Cloudflare's Pingora proxy at a
      # pinned revision, its access log through log, tracing and rtlog. The
      # instruction counts of the access-log call gate; throughput, call-time
      # percentiles and memory of a 3 s run on this shared runner are recorded.
      - name: Pingora access log (a growth of an instruction count of more than 2 % fails)
        if: matrix.what == 'pingora'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake valgrind >/dev/null
          # An empty key is not "no key": without the secret, leave the variable out.
          [ -n "$BENCHER_API_KEY" ] || unset BENCHER_API_KEY
          # shellcheck disable=SC2086 # the branch arguments are a list of options
          bencher run ${{ steps.branch.outputs.args }} \
            --testbed pingora-ubuntu-latest \
            --threshold-measure instructions --threshold-test percentage --threshold-upper-boundary 0.02 \
            --thresholds-reset \
            --error-on-alert \
            --adapter json \
            --file pingora.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            "PINGORA_BMF=$PWD/pingora.json reference/pingora/run.sh 3 16 2 1 > pingora.md"
          cat pingora.md >> "$GITHUB_STEP_SUMMARY"
      - name: Criterion timings on a shared runner (reported, never failing)
        if: matrix.what == 'timing'
        run: |
          # An empty key is not "no key": without the secret, leave the variable out.
          [ -n "$BENCHER_API_KEY" ] || unset BENCHER_API_KEY
          # shellcheck disable=SC2086 # the branch arguments are a list of options
          bencher run ${{ steps.branch.outputs.args }} \
            --testbed ubuntu-latest \
            --threshold-measure latency --threshold-test t_test --threshold-max-sample-size 64 --threshold-upper-boundary 0.99 \
            --thresholds-reset \
            --adapter rust_criterion \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            "cargo bench -p rtlog --bench log_call -- --warm-up-time 1 --measurement-time 3 && cargo bench -p rtlog-decode --bench decode -- --warm-up-time 1 --measurement-time 3"
