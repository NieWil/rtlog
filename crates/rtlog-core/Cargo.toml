[package]
name = "rtlog-core"
description = "Deferred, lock-free, allocation-free logger for no_std and std: ~40-cycle log calls, ~2 KB of flash, formatting done on the host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["logging", "no-std", "embedded", "real-time", "lock-free"]
categories = ["development-tools::debugging", "embedded", "no-std"]

[lib]
name = "rtlog"

[features]
default = ["std"]
std = []

[dependencies]
linkme = "0.3"

# Crash handler (signals, open/write) on Unix with `std`; never on bare metal.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "log_call"
harness = false
