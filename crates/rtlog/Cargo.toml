[package]
name = "rtlog"
description = "Deferred, lock-free, allocation-free logger for no_std and std: ~40-cycle log calls, ~2 KB of flash, formatting done on the host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["logging", "no-std", "embedded", "real-time", "lock-free"]
categories = ["development-tools::debugging", "embedded", "no-std"]

[features]
default = ["std"]
std = []
# Format strings leave the shipped image: each site's strings go into their
# own `rtlog_strs` section next to the descriptors, a linker script keeps both
# sections out of the loaded image, and rtlog never reads a descriptor at run
# time. Enable it in the final binary only; see docs/strip.md.
strip = []

[dependencies]
linkme = "0.3"

# Crash handler (signals or exceptions, open/write) on Unix and Windows with
# `std`; never on bare metal.
[target.'cfg(any(unix, windows))'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "log_call"
harness = false

[lints.rust]
# `cargo llvm-cov` sets cfg(coverage); see crash::write_coverage_profile.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
