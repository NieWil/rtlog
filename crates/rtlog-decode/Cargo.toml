[package]
name = "rtlog-decode"
description = "Host decoder for rtlog streams: contract + stream to text or JSON lines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["logging", "decoder", "embedded", "real-time", "deferred"]
categories = ["development-tools::debugging", "command-line-utilities", "embedded"]

[dependencies]
rtlog-core = { version = "=0.2.2", path = "../rtlog-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "rtlog"
path = "src/bin/rtlog.rs"

[[bench]]
name = "decode"
harness = false
