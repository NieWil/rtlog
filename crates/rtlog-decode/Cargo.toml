[package]
name = "rtlog-decode"
description = "Host decoder and CLI for rtlog: turns binary log streams into text, JSON lines or Perfetto traces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["logging", "decoder", "embedded", "real-time", "deferred"]
categories = ["development-tools::debugging", "command-line-utilities", "embedded"]

[dependencies]
rtlog = { version = "=0.2.3", path = "../rtlog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "rtlog"
path = "src/bin/rtlog.rs"
# The CLI has no API to document, and its docs would go to target/doc/rtlog/,
# the same directory as the rtlog library's: cargo documents both in parallel
# and they race (cargo issue 6313), which failed `cargo doc` in CI.
doc = false

[[bench]]
name = "decode"
harness = false
